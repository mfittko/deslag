[package]
name = "deslag-cli"
description = "Command-line entry point and agent hook adapters for deslag."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "deslag"
path = "src/main.rs"

[dependencies]
deslag-core = { path = "../deslag-core" }
deslag-proxy = { path = "../deslag-proxy" }
deslag-telemetry = { path = "../deslag-telemetry" }
# The runtime is built only for `deslag proxy`. Exact pin, matching deslag-proxy.
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net"] }
serde_json = "1.0.152"

[[bench]]
name = "hook"
harness = false
