[package]
name = "deslag-proxy"
description = "Transparent Anthropic Messages reverse proxy for deslag."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# hyper 1 + hyper-util legacy client stream bodies through without conversion.
# rustls with ring and bundled webpki roots: no C toolchain beyond cc, no system
# trust-store lookup, TLS verification always on. Exact pins; Cargo.lock is committed.
bytes = "=1.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["http1", "server", "client"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "tls12", "ring", "webpki-tokio"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "tokio"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
deslag-core = { path = "../deslag-core" }
# RawValue spans let the proxy splice tool results without re-serializing the request.
serde = "=1.0.229"
serde_json = { version = "=1.0.152", features = ["raw_value"] }
# SHA-256 for session-scope and tool-result digests; already in the tree via rustls.
ring = { version = "=0.17.14", default-features = false }

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
http-body-util = { version = "=0.1.5", features = ["channel"] }
serde_json = "=1.0.152"

[[bench]]
name = "proxy"
harness = false
