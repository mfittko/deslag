[package]
name = "deslag-proxy"
description = "Transparent Anthropic Messages reverse proxy for deslag."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# hyper 1 + hyper-util legacy client stream bodies through without conversion.
# rustls with ring and bundled webpki roots: no C toolchain beyond cc, no system
# trust-store lookup, TLS verification always on. Exact pins; Cargo.lock is committed.
bytes = "=1.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["http1", "server", "client"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "tls12", "ring", "webpki-tokio"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "tokio"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "time"] }

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
http-body-util = { version = "=0.1.5", features = ["channel"] }
