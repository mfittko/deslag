name: release

# A pushed v* tag builds, attests and publishes a GitHub Release.
# workflow_dispatch runs the same verify and build steps as a dry run: it
# publishes nothing and creates no attestation. Pull-request code can never
# start this workflow: it has no pull_request or pull_request_target trigger.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=$(scripts/release/check-versions.sh "$GITHUB_REF_NAME")
          else
            version=$(scripts/release/check-versions.sh)
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      # fetch-depth 0 brings every branch, so origin/main is present.
      - name: Require the release commit on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse HEAD) is not on main; releases ship from main only"
            exit 1
          fi
      - name: Require operator approval for a stable release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          # Empty when the repository variable is unset: the repo owner approves.
          RELEASE_OPERATOR: ${{ vars.RELEASE_OPERATOR }}
        run: scripts/release/verify-approval.sh "$VERSION" "$GITHUB_REPOSITORY"
      # A dry run on a version that is not stamped yet proves extraction on Unreleased.
      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            scripts/release/extract-notes.sh "$VERSION" >release-notes.md
          else
            scripts/release/extract-notes.sh "$VERSION" >release-notes.md ||
              scripts/release/extract-notes.sh Unreleased >release-notes.md
          fi
          cat release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}" -p deslag-cli
      - name: Package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: scripts/release/package.sh "$VERSION" "${{ matrix.target }}"
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: Write SHA256SUMS
        run: |
          scripts/release/checksums.sh dist
          test "$(wc -l <dist/SHA256SUMS)" -eq 2
          cat release-notes.md
      # Re-running a tag run is idempotent: an existing release keeps its
      # notes and gets its assets replaced.
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            flags=()
            case $VERSION in *-*) flags+=(--prerelease) ;; esac
            gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS \
              --verify-tag --title "$tag" --notes-file release-notes.md "${flags[@]}"
          fi
